<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NotSteam OS</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button,input{font-family:inherit;border:none;background:none;cursor:pointer;outline:none}

:root {
  --bg:      #090b12;
  --s1:      #0e1018;
  --s2:      #141620;
  --s3:      #1a1d28;
  --s4:      #20243200;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.14);
  --text:    #e8ecf8;
  --sub:     #8892b0;
  --muted:   #424866;
  --acc:     #ff4438;
  --acc2:    #ff7b6b;
  --blue:    #3d8bff;
  --cyan:    #26c6d8;
  --green:   #2ed47a;
  --mono:    'DM Mono', monospace;
  --disp:    'Barlow Condensed', sans-serif;
  --r:       6px;
  --sidebar: 220px;
  --topbar:  52px;
  --botbar:  38px;
}

html,body { height:100%; overflow:hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--disp);
  display: flex;
  flex-direction: column;
  height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Subtle grid bg */
body::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(61,139,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(61,139,255,0.018) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* ══ TOPBAR ══════════════════════════════════════════ */
.topbar {
  height: var(--topbar);
  background: var(--s1);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
  position: relative;
  z-index: 200;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--disp);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 5px;
  text-transform: uppercase;
}
.logo img {
  width: 28px; height: 28px;
  object-fit: contain;
  filter: drop-shadow(0 0 8px rgba(255,68,56,0.7));
}
.logo-not   { color: var(--acc); }
.logo-dot   {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
  animation: pulse 2.4s ease-in-out infinite;
}
.logo-steam { color: var(--text); }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }

.topbar-right {
  display: flex; align-items: center; gap: 16px;
  font-family: var(--mono); font-size: 11px; color: var(--sub);
}
.online { display:flex; align-items:center; gap:5px; }
.online-dot { width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2.4s ease-in-out infinite; }
#clock { color: var(--text); font-size: 14px; font-weight:500; letter-spacing:1px; }

/* mobile burger */
.burger {
  display: none;
  flex-direction: column; gap: 5px;
  padding: 6px; border-radius: var(--r);
  background: var(--s2); border: 1px solid var(--border);
  cursor: pointer;
}
.burger span { width:18px;height:2px;background:var(--sub);border-radius:2px;transition:all .2s; }

/* ══ LAYOUT ══════════════════════════════════════════ */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

/* ══ SIDEBAR ══════════════════════════════════════════ */
.sidebar {
  width: var(--sidebar);
  background: var(--s1);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  scrollbar-width: none;
  transition: transform .25s cubic-bezier(.4,0,.2,1);
}
.sidebar::-webkit-scrollbar { display:none; }

.sidebar-section {
  padding: 14px 14px 6px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--muted);
}

.console-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: background .1s, border-color .1s;
  position: relative;
}
.console-item:hover { background: rgba(255,255,255,.04); }
.console-item.active {
  background: rgba(255,255,255,.06);
  border-left-color: var(--ci-color, var(--acc));
}
.console-item.active .console-name { color: var(--text); }

.ci-icon {
  width: 34px; height: 34px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
}
.ci-name-wrap { flex:1; min-width:0; }
.console-name { font-size: 14px; font-weight: 600; color: var(--sub); }
.console-count { font-family:var(--mono); font-size:10px; color:var(--muted); }

/* ══ CONTENT ══════════════════════════════════════════ */
.content {
  flex: 1;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* ══ HERO ══════════════════════════════════════════════ */
.hero {
  height: 200px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
}
.hero-bg {
  position: absolute; inset: 0;
  transition: background .35s;
}
.hero-fade {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(9,11,18,1) 20%, rgba(9,11,18,.75) 60%, rgba(9,11,18,.15) 100%);
}
.hero-body {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 20px 24px;
}
.hero-console {
  font-family: var(--mono);
  font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--acc); margin-bottom: 5px;
  transition: color .25s;
}
.hero-title {
  font-size: 32px; font-weight: 800; line-height: 1;
  letter-spacing: .5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 520px; margin-bottom: 8px;
}
.hero-meta {
  display: flex; gap: 12px; align-items: center;
  font-family: var(--mono); font-size: 10px; color: var(--sub);
  margin-bottom: 14px;
}
.hero-meta-sep { opacity:.3; }

.btn-launch {
  display: none;
  align-items: center; gap: 8px;
  background: var(--acc);
  color: #fff;
  padding: 9px 22px;
  border-radius: var(--r);
  font-family: var(--disp); font-size: 14px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase;
  box-shadow: 0 2px 20px rgba(255,68,56,.35);
  transition: background .12s, transform .12s, box-shadow .12s;
  width: fit-content; cursor: pointer;
}
.btn-launch.show { display: flex; }
.btn-launch:hover { background: #e0302a; transform: translateY(-1px); box-shadow: 0 4px 26px rgba(255,68,56,.5); }
.btn-launch:active { transform: translateY(0); }

.hero-loadbar {
  position: absolute; bottom: 0; left: 0; height: 2px;
  background: linear-gradient(90deg, var(--acc), var(--cyan));
  box-shadow: 0 0 10px var(--acc);
  border-radius: 0 1px 1px 0;
  transition: width .2s;
}

/* ══ TOOLBAR ══════════════════════════════════════════ */
.toolbar {
  height: 42px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(14,16,24,.8);
  flex-shrink: 0;
  gap: 10px;
}
.toolbar-left { display:flex; align-items:center; gap:8px; min-width:0; }
.tb-title {
  font-size: 11px; font-weight: 600; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--sub);
  font-family: var(--mono);
}
.tb-count { font-family:var(--mono); font-size:10px; color:var(--muted); }

.search-box {
  display: flex; align-items: center; gap: 7px;
  background: var(--s3); border: 1px solid var(--border);
  border-radius: var(--r); padding: 6px 10px;
  transition: border-color .15s;
  flex-shrink: 0;
}
.search-box:focus-within { border-color: rgba(61,139,255,.4); }
.search-box span { color: var(--muted); font-size: 13px; }
.search-box input {
  background: none; color: var(--text);
  font-family: var(--mono); font-size: 11px;
  width: 140px;
}
.search-box input::placeholder { color: var(--muted); }

/* ══ GAME LIST ══════════════════════════════════════════ */
.game-list {
  flex: 1; overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.06) transparent;
}
.game-list::-webkit-scrollbar { width: 4px; }
.game-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.06); border-radius: 2px; }

.game-row {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 20px;
  border-bottom: 1px solid rgba(255,255,255,.04);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background .08s;
}
.game-row:hover { background: rgba(255,255,255,.04); }
.game-row.focused {
  background: rgba(255,255,255,.06);
  border-left-color: var(--gr-color, var(--acc));
}

.gr-thumb {
  width: 40px; height: 30px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
  border: 1px solid rgba(255,255,255,.07);
}
.gr-info { flex:1; min-width:0; }
.gr-name {
  font-size: 14px; font-weight: 600; color: #9daac8;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.game-row.focused .gr-name { color: var(--text); }
.gr-sub { font-family:var(--mono); font-size:10px; color:var(--muted); margin-top:1px; }
.gr-size { font-family:var(--mono); font-size:10px; color:var(--muted); flex-shrink:0; }

.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 10px; color: var(--muted);
}
.empty-icon { font-size: 38px; opacity:.18; }
.empty-title { font-size:12px; letter-spacing:2px; text-transform:uppercase; }
.empty-sub { font-family:var(--mono); font-size:10px; opacity:.45; }

/* ══ BOTTOMBAR ══════════════════════════════════════════ */
.bottombar {
  height: var(--botbar);
  background: var(--s1); border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; flex-shrink: 0;
  font-family: var(--mono); font-size: 10px; color: var(--muted);
  position: relative; z-index: 200;
}
.hints { display:flex; gap:14px; align-items:center; }
.hint { display:flex; align-items:center; gap:5px; }
.hkey {
  background: var(--s3); border: 1px solid var(--border2);
  border-radius: 3px; padding: 1px 6px; font-size: 10px;
  color: rgba(255,255,255,.45); font-weight: 600;
  min-width: 20px; text-align: center;
}
.version { font-size:9px; opacity:.28; letter-spacing:1px; }

/* ══ EMULATOR OVERLAY ══════════════════════════════════ */
#emulator-overlay {
  position: fixed; inset: 0;
  background: #000;
  z-index: 1000;
  display: flex; flex-direction: column;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
#emulator-overlay.hidden { display: none !important; }

.emu-bar {
  height: 46px;
  background: rgba(8,10,16,.98); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; flex-shrink: 0; z-index: 10;
}
.emu-left { display:flex; align-items:center; gap:10px; }
.emu-badge {
  font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
  font-weight: 600; padding: 3px 8px; border-radius: 4px;
}
.emu-title { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
.emu-sep { color: var(--border2); margin: 0 2px; }

.btn-quit {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,68,56,.1); color: var(--acc);
  border: 1px solid rgba(255,68,56,.25); border-radius: var(--r);
  padding: 7px 16px;
  font-family: var(--disp); font-weight: 700; font-size: 13px;
  letter-spacing: 1.5px; text-transform: uppercase;
  transition: background .12s, border-color .12s;
}
.btn-quit:hover { background: rgba(255,68,56,.22); border-color: rgba(255,68,56,.5); }

#display {
  flex: 1; width: 100%;
  min-height: 0; overflow: hidden;
  position: relative;
  background: #000;
}

/* ══ MOBILE SIDEBAR OVERLAY ══════════════════════════════ */
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 150;
  backdrop-filter: blur(4px);
}

/* ══ RESPONSIVE ══════════════════════════════════════════ */
@media (max-width: 700px) {
  :root {
    --topbar: 48px;
    --botbar: 42px;
  }

  /* burger visible */
  .burger { display: flex; }
  .topbar-hints { display: none; }

  /* sidebar devient un drawer */
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 240px;
    z-index: 300;
    transform: translateX(-100%);
    box-shadow: 4px 0 24px rgba(0,0,0,.6);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }

  /* hero plus compact */
  .hero { height: 160px; }
  .hero-title { font-size: 24px; max-width: 100%; }
  .hero-body { padding: 16px 16px; }
  .hero-meta { display: none !important; }
  .btn-launch { padding: 8px 18px; font-size: 13px; }

  /* toolbar */
  .toolbar { padding: 0 12px; }
  .search-box input { width: 110px; }

  /* game rows */
  .game-row { padding: 10px 14px; }
  .gr-size { display: none; }
  .gr-name { font-size: 13px; }

  /* bottombar */
  .bottombar { padding: 0 14px; }
  .hints { gap: 10px; }
  .hint:nth-child(n+3) { display: none; }

  /* emu bar */
  .emu-bar { padding: 0 12px; height: 44px; }
  .emu-sep, .emu-title { display: none; }

  .version { display: none; }
}
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="logo">
    <img src="notsteam.png" alt="">
    <span class="logo-not">NOT</span>
    <div class="logo-dot"></div>
    <span class="logo-steam">STEAM</span>
  </div>
  <div class="topbar-right">
    <button class="burger" id="burger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="online topbar-hints"><div class="online-dot"></div>EN LIGNE</div>
    <div id="clock" class="topbar-hints">00:00</div>
  </div>
</header>

<!-- LAYOUT -->
<div class="layout">

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-section">Consoles</div>
    <div id="console-list"></div>
  </nav>

  <!-- CONTENT -->
  <div class="content">

    <!-- HERO -->
    <div class="hero">
      <div class="hero-bg" id="hero-bg"></div>
      <div class="hero-fade"></div>
      <div class="hero-body">
        <div class="hero-console" id="hero-console">NOTSTEAM OS</div>
        <div class="hero-title" id="hero-title">Choisir un jeu</div>
        <div class="hero-meta" id="hero-meta" style="display:none">
          <span id="hero-size">—</span>
          <span class="hero-meta-sep">·</span>
          <span id="hero-file">—</span>
        </div>
        <button class="btn-launch" id="btn-launch" onclick="launchSelected()">▶ LANCER</button>
      </div>
      <div class="hero-loadbar" id="loadbar" style="width:0%"></div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="tb-title" id="tb-title">—</span>
        <span class="tb-count" id="tb-count"></span>
      </div>
      <div class="search-box">
        <span>⌕</span>
        <input type="text" id="search" placeholder="Rechercher…" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <!-- GAME LIST -->
    <div class="game-list" id="game-list"></div>

  </div>
</div>

<!-- BOTTOMBAR -->
<footer class="bottombar">
  <div class="hints topbar-hints">
    <div class="hint"><span class="hkey">↑↓</span>Naviguer</div>
    <div class="hint"><span class="hkey">←→</span>Console</div>
    <div class="hint"><span class="hkey">↵</span>Lancer</div>
    <div class="hint"><span class="hkey">/</span>Chercher</div>
  </div>
  <span class="version">NotSteam OS v2.3 · kevinraphael95</span>
</footer>

<!-- EMULATOR OVERLAY -->
<div id="emulator-overlay" class="hidden">
  <div class="emu-bar">
    <div class="emu-left">
      <span class="emu-badge" id="emu-badge"></span>
      <span class="emu-sep">|</span>
      <span class="emu-title" id="emu-title"></span>
    </div>
    <button class="btn-quit" id="quit-btn">✕ Quitter</button>
  </div>
  <div id="display"></div>
</div>

<script>
'use strict';

const GH_USER = 'kevinraphael95';
const GH_REPO = 'notsteam';
const API = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/`;
const RAW = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/`;

const CONSOLES = [
  { id:'nes',  name:'NES',           short:'NES',  icon:'🕹️', ext:'.nes', core:'nes',  color:'#ff4438', folder:'nes'  },
  { id:'gba',  name:'Game Boy Adv.', short:'GBA',  icon:'🎮', ext:'.gba', core:'gba',  color:'#8b5cf6', folder:'gba'  },
  { id:'snes', name:'Super NES',     short:'SNES', icon:'🎯', ext:'.sfc', core:'snes', color:'#3d8bff', folder:'snes' },
  { id:'gb',   name:'Game Boy',      short:'GB',   icon:'📱', ext:'.gb',  core:'gb',   color:'#22c55e', folder:'gb'   },
  { id:'n64',  name:'Nintendo 64',   short:'N64',  icon:'🌀', ext:'.z64', core:'n64',  color:'#06b6d4', folder:'n64'  },
  { id:'ps1',  name:'PlayStation',   short:'PS1',  icon:'💿', ext:'.bin', core:'psx',  color:'#6366f1', folder:'ps1'  },
];

const state = {
  idx: 0, games: [], filtered: [],
  gameIdx: -1, loading: false, gpLast: 0
};

const $  = id => document.getElementById(id);
const $$ = s  => document.querySelectorAll(s);

/* CLOCK */
function tick() {
  $('clock').textContent = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
tick(); setInterval(tick, 1000);

/* MOBILE SIDEBAR */
$('burger').addEventListener('click', () => {
  $('sidebar').classList.toggle('open');
  $('sidebar-overlay').classList.toggle('open');
});
$('sidebar-overlay').addEventListener('click', closeSidebar);
function closeSidebar() {
  $('sidebar').classList.remove('open');
  $('sidebar-overlay').classList.remove('open');
}

/* SIDEBAR RENDER */
function renderSidebar() {
  $('console-list').innerHTML = CONSOLES.map((c, i) => `
    <div class="console-item ${i===0?'active':''}" id="si-${c.id}"
         style="--ci-color:${c.color}"
         onclick="pickConsole(${i});closeSidebar()">
      <div class="ci-icon" style="background:${c.color}1c;color:${c.color}">${c.icon}</div>
      <div class="ci-name-wrap">
        <div class="console-name">${c.name}</div>
        <div class="console-count" id="cnt-${c.id}">—</div>
      </div>
    </div>`).join('');
}

function updateSidebar() {
  $$('.console-item').forEach((el, i) => el.classList.toggle('active', i === state.idx));
}

/* PICK CONSOLE */
async function pickConsole(i) {
  if (state.loading) return;
  state.idx = i; state.games = []; state.filtered = []; state.gameIdx = -1;
  const c = CONSOLES[i];

  updateSidebar();
  document.documentElement.style.setProperty('--acc', c.color);

  $('hero-console').textContent = c.name.toUpperCase();
  $('hero-console').style.color = c.color;
  $('hero-title').textContent = 'Scan en cours…';
  $('hero-meta').style.display = 'none';
  $('btn-launch').classList.remove('show');
  $('tb-title').textContent = c.name;
  $('tb-count').textContent = '';
  $('game-list').innerHTML = '';
  $('search').value = '';

  setLoading(true);
  try {
    const r = await fetch(API + c.folder);
    if (!r.ok) throw new Error(r.status);
    const files = await r.json();
    state.games = files
      .filter(f => f.type==='file' && f.name.toLowerCase().endsWith(c.ext))
      .map(f => ({ title: f.name.slice(0,-c.ext.length).replace(/_/g,' '), file: f.name, size: f.size }));
    $(`cnt-${c.id}`).textContent = `${state.games.length} ROM${state.games.length!==1?'s':''}`;
  } catch { state.games = []; }
  setLoading(false);

  state.filtered = [...state.games];
  renderGames();
  if (state.filtered.length > 0) focusGame(0, false);
  else { $('hero-title').textContent = 'Aucun jeu'; }
}

/* RENDER GAMES */
function renderGames() {
  const c = CONSOLES[state.idx];
  $('tb-count').textContent = `${state.filtered.length} jeu${state.filtered.length!==1?'x':''}`;

  if (!state.filtered.length) {
    $('game-list').innerHTML = `<div class="empty-state">
      <div class="empty-icon">${state.games.length?'🔍':'📦'}</div>
      <div class="empty-title">${state.games.length?'Aucun résultat':'Dossier vide'}</div>
      <div class="empty-sub">${state.games.length?'Modifie ta recherche':'/'+c.folder+'/ est vide'}</div>
    </div>`;
    return;
  }

  $('game-list').innerHTML = state.filtered.map((g, i) => `
    <div class="game-row ${i===state.gameIdx?'focused':''}" id="gr-${i}"
         style="--gr-color:${c.color}"
         onclick="launchGame(${i})"
         onmouseenter="focusGame(${i},false)">
      <div class="gr-thumb" style="background:${c.color}1a;color:${c.color}">${c.icon}</div>
      <div class="gr-info">
        <div class="gr-name">${esc(g.title)}</div>
        <div class="gr-sub">${c.short} · ${esc(g.file)}</div>
      </div>
      <div class="gr-size">${fmtSize(g.size)}</div>
    </div>`).join('');
}

/* FOCUS GAME */
function focusGame(i, scroll=true) {
  state.gameIdx = i;
  const g = state.filtered[i]; if (!g) return;
  const c = CONSOLES[state.idx];

  $('hero-title').textContent = g.title;
  $('hero-console').textContent = c.name.toUpperCase();
  $('hero-console').style.color = c.color;
  $('hero-bg').style.background = `radial-gradient(ellipse at 80% 50%, ${c.color}20 0%, transparent 65%)`;
  $('hero-meta').style.display = 'flex';
  $('hero-size').textContent = fmtSize(g.size);
  $('hero-file').textContent = g.file;
  $('btn-launch').classList.add('show');

  $$('.game-row').forEach((el, idx) => el.classList.toggle('focused', idx===i));
  if (scroll) { const row = $(`gr-${i}`); if (row) row.scrollIntoView({block:'nearest'}); }
}

/* LAUNCH */
function launchSelected() { if (state.gameIdx >= 0) launchGame(state.gameIdx); }

function launchGame(i) {
  const g = state.filtered[i ?? state.gameIdx];
  const c = CONSOLES[state.idx];
  if (!g || !c) return;

  destroyEmulator();

  $('emulator-overlay').classList.remove('hidden');
  $('emu-title').textContent = g.title;
  const badge = $('emu-badge');
  badge.textContent = c.short;
  badge.style.background = c.color + '28';
  badge.style.color = c.color;
  badge.style.border = `1px solid ${c.color}55`;

  requestAnimationFrame(() => requestAnimationFrame(() => {
    window.EJS_player         = '#display';
    window.EJS_core           = c.core;
    window.EJS_gameUrl        = RAW + c.folder + '/' + encodeURIComponent(g.file);
    window.EJS_pathtodata     = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded  = true;
    window.EJS_gamepadEnabled = true;

    const s = document.createElement('script');
    s.id  = 'ejs-script';
    s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js?t=' + Date.now();
    document.head.appendChild(s);
  }));
}

/* DESTROY EMULATOR */
function destroyEmulator() {
  try { if (window.EJS_emulator) window.EJS_emulator.exit(); } catch {}
  const s = document.getElementById('ejs-script');
  if (s) s.remove();

  // Remplace le nœud #display entier — coupe tous les listeners EJS
  const old = $('display');
  if (old) {
    const fresh = document.createElement('div');
    fresh.id = 'display';
    old.parentNode.replaceChild(fresh, old);
  }

  // Nettoie éléments parasites EJS injectés hors #display
  document.querySelectorAll('[id^="emulator"],[class*="emulatorjs"]').forEach(el => {
    if (el.id !== 'emulator-overlay') el.remove();
  });

  ['EJS_player','EJS_core','EJS_gameUrl','EJS_pathtodata',
   'EJS_startOnLoaded','EJS_gamepadEnabled','EJS_emulator']
    .forEach(k => { try { delete window[k]; } catch {} });
}

$('quit-btn').addEventListener('click', () => {
  destroyEmulator();
  $('emulator-overlay').classList.add('hidden');
});

/* SEARCH */
$('search').addEventListener('input', () => {
  const q = $('search').value.toLowerCase().trim();
  state.filtered = q
    ? state.games.filter(g => g.title.toLowerCase().includes(q) || g.file.toLowerCase().includes(q))
    : [...state.games];
  state.gameIdx = -1;
  renderGames();
  if (state.filtered.length > 0) focusGame(0, false);
});

/* KEYBOARD NAV */
document.addEventListener('keydown', e => {
  if (!$('emulator-overlay').classList.contains('hidden')) return;
  if (document.activeElement === $('search')) {
    if (e.key === 'Escape') {
      $('search').blur(); $('search').value = '';
      $('search').dispatchEvent(new Event('input'));
    }
    return;
  }
  const map = {
    ArrowUp:    () => { if (state.gameIdx > 0) focusGame(state.gameIdx - 1); },
    ArrowDown:  () => { if (state.gameIdx < state.filtered.length-1) focusGame(state.gameIdx + 1); },
    ArrowLeft:  () => { if (state.idx > 0) pickConsole(state.idx - 1); },
    ArrowRight: () => { if (state.idx < CONSOLES.length-1) pickConsole(state.idx + 1); },
    Enter:      () => { if (state.gameIdx >= 0) launchGame(state.gameIdx); },
    '/':        () => $('search').focus(),
  };
  if (map[e.key]) { if (e.key !== '/') e.preventDefault(); map[e.key](); }
});

/* GAMEPAD */
window.addEventListener('gamepadconnected', e => console.log('[NotSteam] Manette:', e.gamepad.id));

function pollGamepad() {
  const gp = navigator.getGamepads?.()[0];
  if (!gp || !$('emulator-overlay').classList.contains('hidden')) return;
  const now = Date.now();
  if (now - state.gpLast < 160) return;
  const up    = gp.axes[1] < -0.5 || gp.buttons[12]?.pressed;
  const down  = gp.axes[1] >  0.5 || gp.buttons[13]?.pressed;
  const left  = gp.axes[0] < -0.5 || gp.buttons[14]?.pressed;
  const right = gp.axes[0] >  0.5 || gp.buttons[15]?.pressed;
  const lb    = gp.buttons[4]?.pressed;
  const rb    = gp.buttons[5]?.pressed;
  const a     = gp.buttons[0]?.pressed;

  if (up    && state.gameIdx > 0)                    { focusGame(state.gameIdx-1); state.gpLast=now; }
  if (down  && state.gameIdx < state.filtered.length-1) { focusGame(state.gameIdx+1); state.gpLast=now; }
  if ((lb||left)  && state.idx > 0)                 { pickConsole(state.idx-1); state.gpLast=now; }
  if ((rb||right) && state.idx < CONSOLES.length-1) { pickConsole(state.idx+1); state.gpLast=now; }
  if (a && state.gameIdx >= 0)                       { launchGame(state.gameIdx); state.gpLast=now; }
}
setInterval(pollGamepad, 16);

/* LOADING BAR */
let _lt = null;
function setLoading(on) {
  const bar = $('loadbar'); clearInterval(_lt);
  if (on) {
    let w = 0; bar.style.transition='width .2s ease'; bar.style.width='0%';
    _lt = setInterval(() => { w = Math.min(w+Math.random()*14,90); bar.style.width=w+'%'; }, 100);
  } else {
    bar.style.transition='width .3s ease'; bar.style.width='100%';
    setTimeout(() => { bar.style.transition='none'; bar.style.width='0%'; }, 350);
  }
}

/* UTILS */
function fmtSize(b) {
  if (!b) return '—';
  if (b<1024) return b+' B';
  if (b<1048576) return (b/1024).toFixed(0)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* BOOT */
renderSidebar();
pickConsole(0);
</script>
</body>
