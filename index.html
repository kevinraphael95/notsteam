<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NotSteam OS</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="header">
  <div id="logo">
    <img src="notsteam.png" alt="" onerror="this.style.display='none'">
    <span class="not">NOT</span>
    <div class="dot"></div>
    <span class="steam">STEAM</span>
  </div>
  <div id="header-right">
    <div class="online"><div class="online-dot"></div>EN LIGNE</div>
    <div id="clock">00:00</div>
  </div>
</header>

<!-- ÉCRAN CONSOLES -->
<div id="screen-consoles">
  <div id="consoles-title">CHOISIR UNE CONSOLE</div>
  <div id="console-grid"></div>
</div>

<!-- ÉCRAN JEUX -->
<div id="screen-games" class="hidden">
  <div id="games-topbar">
    <button id="btn-back">‹ Retour</button>
    <div id="games-title"></div>
    <div id="games-count"></div>
    <div id="search-wrap">
      <span>⌕</span>
      <input id="search" type="text" placeholder="Rechercher…" autocomplete="off">
    </div>
  </div>
  <div id="game-list"></div>
</div>

<!-- OVERLAY EMULATEUR -->
<div id="emulator-overlay" class="hidden">
  <div id="emu-bar">
    <div id="emu-left">
      <span id="emu-badge"></span>
      <span id="emu-title"></span>
    </div>
    <button id="quit-btn">✕ QUITTER</button>
  </div>
  <div id="display"></div>
</div>

<footer id="statusbar">
  <span class="status-item"><kbd>↑↓←→</kbd> Naviguer</span>
  <span class="status-item"><kbd>↵</kbd> Lancer</span>
  <span class="status-item"><kbd>/</kbd> Chercher</span>
  <span id="status-version">NotSteam OS v2.0 · kevinraphael95</span>
</footer>

<script type="module" src="app.js"></script>
<script>
(function tick(){
  const d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  setTimeout(tick, 1000);
})();
</script>
</body>
</html>
