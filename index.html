<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NotSteam OS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080c10;
  --surface: #0d1117;
  --surface2: #161b22;
  --border: rgba(255,255,255,0.07);
  --blue: #58a6ff;
  --cyan: #39d0d8;
  --green: #3fb950;
  --red: #f85149;
  --text: #e6edf3;
  --muted: #7d8590;
  --accent: #58a6ff;
  --sidebar-w: 200px;
  --topbar-h: 52px;
  --bottombar-h: 38px;
  --hero-h: 190px;
  --transition-fast: 120ms cubic-bezier(0.4,0,0.2,1);
  --transition-med: 250ms cubic-bezier(0.4,0,0.2,1);
}

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
  user-select: none;
}

/* Scanline overlay */
body::before {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.018) 2px, rgba(0,0,0,0.018) 4px);
  pointer-events: none;
  z-index: 9999;
}

/* Grid overlay */
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(88,166,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(88,166,255,0.018) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* ── TOPBAR ───────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px 0 12px;
  height: var(--topbar-h);
  background: rgba(8,12,16,0.98);
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 100;
  flex-shrink: 0;
  backdrop-filter: blur(12px);
  gap: 12px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.logo-img {
  height: 36px;
  width: 36px;
  object-fit: contain;
  filter: drop-shadow(0 0 8px rgba(248,81,73,0.4));
  transition: filter var(--transition-med);
}
.logo:hover .logo-img {
  filter: drop-shadow(0 0 14px rgba(248,81,73,0.7));
}
.logo-wordmark {
  display: flex;
  align-items: baseline;
  gap: 3px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  line-height: 1;
}
.logo-not { color: var(--red); }
.logo-steam { color: var(--blue); }

.topbar-right {
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  flex-shrink: 0;
}

/* Status dot */
.status { display: flex; align-items: center; gap: 5px; font-size: 10px; letter-spacing: 0.5px; }
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 5px var(--green);
  animation: blink 2.4s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(0.7)} }

#clock { color: var(--text); font-size: 13px; letter-spacing: 1px; }

/* Input mode badge */
#input-mode {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 9px;
  letter-spacing: 1.5px;
  padding: 3px 9px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  transition: var(--transition-med);
}
#input-mode.gamepad { border-color: rgba(57,208,216,0.3); color: var(--cyan); }
#input-mode.keyboard { border-color: rgba(88,166,255,0.3); color: var(--blue); }
#input-mode.mouse { border-color: rgba(63,185,80,0.3); color: var(--green); }

/* Hide on small screens */
@media (max-width: 500px) {
  .topbar-right .status, #input-mode { display: none; }
}

/* ── LAYOUT ───────────────────────────────────── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
  z-index: 1;
  min-height: 0;
}

/* ── SIDEBAR ──────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  background: rgba(8,12,16,0.9);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  scrollbar-width: none;
  transition: width var(--transition-med);
}

@media (max-width: 640px) {
  .sidebar { width: 58px; }
  .sidebar .sidebar-label, .sidebar .console-info { display: none; }
  .console-item { padding: 10px; justify-content: center; }
  .console-icon { width: 36px; height: 36px; }
}

.sidebar-label {
  padding: 14px 14px 6px;
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  font-family: 'Share Tech Mono', monospace;
  opacity: 0.5;
}

.console-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  cursor: pointer;
  transition: var(--transition-fast);
  border-left: 2px solid transparent;
  position: relative;
}
.console-item:hover { background: rgba(255,255,255,0.04); }
.console-item.active {
  background: rgba(255,255,255,0.055);
  border-left-color: var(--accent);
}
.console-item.active .console-name { color: var(--text); }

.console-icon {
  width: 32px; height: 32px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
  transition: var(--transition-fast);
}
.console-item.active .console-icon { filter: brightness(1.2); }

.console-info { flex: 1; min-width: 0; }
.console-name { font-size: 12px; font-weight: 600; color: #9ca3b0; transition: var(--transition-fast); white-space: nowrap; }
.console-count { font-size: 9px; color: var(--muted); font-family: 'Share Tech Mono', monospace; }

/* ── CONTENT ──────────────────────────────────── */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  min-width: 0;
}

/* ── HERO ─────────────────────────────────────── */
.hero {
  height: var(--hero-h);
  position: relative;
  flex-shrink: 0;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
}

@media (max-width: 640px) {
  :root { --hero-h: 140px; }
}

.hero-bg {
  position: absolute; inset: 0;
  transition: background 0.4s ease;
}
.hero-gradient {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(8,12,16,0.99) 30%, rgba(8,12,16,0.65) 65%, rgba(8,12,16,0.1) 100%);
}
.hero-content {
  position: absolute; inset: 0;
  display: flex; align-items: flex-end;
  padding: 18px 20px;
}
.hero-info { max-width: 90%; }
.hero-console-tag {
  font-size: 8px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--accent); font-family: 'Share Tech Mono', monospace;
  margin-bottom: 4px; transition: color var(--transition-med);
}
.hero-title {
  font-size: 22px; font-weight: 700; line-height: 1.15;
  margin-bottom: 10px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.9);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 100%;
}
@media (max-width: 640px) {
  .hero-title { font-size: 17px; margin-bottom: 7px; }
}

.hero-meta {
  display: flex; gap: 10px; align-items: center;
  font-size: 10px; color: var(--muted);
  font-family: 'Share Tech Mono', monospace;
  margin-bottom: 10px; flex-wrap: wrap;
}
.hero-meta-item { display: flex; align-items: center; gap: 4px; }

.hero-hint {
  font-size: 10px;
  color: rgba(255,255,255,0.3);
  font-family: 'Share Tech Mono', monospace;
  letter-spacing: 1px;
  display: flex; align-items: center; gap: 7px;
  padding: 4px 10px;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 3px;
  background: rgba(255,255,255,0.03);
  width: fit-content;
  animation: heroHintPulse 2s ease-in-out infinite;
}
@keyframes heroHintPulse { 0%,100%{opacity:0.45} 50%{opacity:0.9} }
.hero-hint.hidden { display: none; }

.loading-bar {
  position: absolute; bottom: 0; left: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--cyan));
  border-radius: 0 1px 1px 0;
  transition: width 0.25s ease, box-shadow 0.25s;
  box-shadow: 0 0 8px var(--accent);
}

/* ── CONSOLE TABS (mobile) ────────────────────── */
.console-tabs {
  display: none;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
  background: rgba(8,12,16,0.9);
  flex-shrink: 0;
}
.console-tabs::-webkit-scrollbar { display: none; }

@media (max-width: 640px) {
  .sidebar { display: none; }
  .console-tabs { display: flex; }
}

.tab-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 7px 12px;
  cursor: pointer; flex-shrink: 0;
  border-bottom: 2px solid transparent;
  transition: var(--transition-fast);
  font-size: 9px; color: var(--muted);
  font-family: 'Share Tech Mono', monospace;
  letter-spacing: 0.5px;
}
.tab-item.active {
  border-bottom-color: var(--accent);
  color: var(--text);
}
.tab-icon { font-size: 16px; }

/* ── LIST HEADER ──────────────────────────────── */
.list-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 16px 8px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
  background: rgba(8,12,16,0.5);
  gap: 8px;
}
.list-title {
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted); font-family: 'Share Tech Mono', monospace;
  white-space: nowrap;
}
.list-right { display: flex; gap: 8px; align-items: center; min-width: 0; }
.list-stats { font-size: 10px; color: var(--muted); font-family: 'Share Tech Mono', monospace; white-space: nowrap; }

.search-wrap {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 4px; padding: 4px 8px;
  font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--muted);
  transition: var(--transition-fast);
  min-width: 0;
}
.search-wrap:focus-within {
  border-color: rgba(88,166,255,0.3);
  background: rgba(88,166,255,0.05);
}
.search-wrap input {
  background: none; border: none; outline: none;
  color: var(--text); font-family: inherit; font-size: inherit;
  width: 100px; min-width: 60px;
}
.search-wrap input::placeholder { color: var(--muted); }

@media (max-width: 400px) {
  .list-stats { display: none; }
  .search-wrap input { width: 80px; }
}

/* ── GAME LIST ────────────────────────────────── */
.game-list {
  flex: 1; overflow-y: auto; padding: 3px 0;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.07) transparent;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.game-row {
  display: flex; align-items: center; gap: 11px;
  padding: 8px 16px; cursor: pointer;
  transition: background var(--transition-fast);
  border-bottom: 1px solid rgba(255,255,255,0.022);
  border-left: 2px solid transparent;
  position: relative;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
.game-row:hover { background: rgba(255,255,255,0.04); }
.game-row:active { background: rgba(255,255,255,0.07); }
.game-row.focused {
  background: rgba(255,255,255,0.055);
  border-left-color: var(--accent);
  padding-left: 14px;
}
.game-row.focused::after {
  content: attr(data-hint);
  position: absolute; right: 14px;
  font-size: 9px; letter-spacing: 1px;
  color: var(--accent);
  font-family: 'Share Tech Mono', monospace; opacity: 0.65;
}
@media (max-width: 500px) {
  .game-row.focused::after { display: none; }
}

.game-thumb {
  width: 40px; height: 30px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.06);
  transition: var(--transition-fast);
}
.game-row.focused .game-thumb { filter: brightness(1.3); }

.game-meta { flex: 1; min-width: 0; }
.game-name {
  font-size: 13px; font-weight: 600; color: #cdd5e0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color var(--transition-fast);
}
.game-row.focused .game-name { color: var(--text); }
.game-sub { font-size: 9px; color: var(--muted); font-family: 'Share Tech Mono', monospace; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.game-size { font-size: 9px; color: var(--muted); font-family: 'Share Tech Mono', monospace; white-space: nowrap; flex-shrink: 0; }
@media (max-width: 400px) { .game-size { display: none; } }

.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 8px; color: var(--muted);
}
.empty-icon { font-size: 36px; opacity: 0.22; }
.empty-title { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
.empty-sub { font-size: 10px; font-family: 'Share Tech Mono', monospace; opacity: 0.45; text-align: center; padding: 0 20px; }

/* ── EMULATOR OVERLAY ─────────────────────────── */
#emulator-overlay {
  position: fixed; inset: 0; background: #000; z-index: 1000;
  display: flex; flex-direction: column;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
#emulator-overlay.hidden { display: none !important; }

.emu-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px;
  background: rgba(8,12,16,0.98); border-bottom: 1px solid var(--border);
  flex-shrink: 0; gap: 10px;
}
.emu-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.emu-logo { height: 24px; width: 24px; object-fit: contain; flex-shrink: 0; }
.emu-badge {
  font-size: 8px; padding: 2px 8px; border-radius: 3px;
  font-family: 'Share Tech Mono', monospace; letter-spacing: 2px; font-weight: 700;
  flex-shrink: 0;
}
.emu-title-text { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.emu-sep { color: var(--border); flex-shrink: 0; }

.btn-quit {
  display: flex; align-items: center; gap: 5px;
  padding: 6px 12px; background: rgba(248,81,73,0.12); color: var(--red);
  border: 1px solid rgba(248,81,73,0.3); border-radius: 4px;
  font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 11px;
  letter-spacing: 1.5px; cursor: pointer; transition: var(--transition-fast);
  text-transform: uppercase; flex-shrink: 0;
}
.btn-quit:hover { background: rgba(248,81,73,0.22); border-color: rgba(248,81,73,0.5); }

#display { flex: 1; overflow: hidden; }

/* ── BOTTOM BAR ───────────────────────────────── */
.bottombar {
  height: var(--bottombar-h);
  background: rgba(8,12,16,0.98); border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; flex-shrink: 0; position: relative; z-index: 100;
  font-size: 9px; font-family: 'Share Tech Mono', monospace; color: var(--muted);
  gap: 10px;
}
.hints { display: flex; gap: 10px; align-items: center; flex-wrap: nowrap; }
.hint { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.hkey {
  background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 3px; padding: 1px 5px; font-size: 9px; color: rgba(255,255,255,0.55);
  font-weight: 700; min-width: 18px; text-align: center;
}
.version { opacity: 0.28; font-size: 8px; letter-spacing: 0.5px; white-space: nowrap; flex-shrink: 0; }
@media (max-width: 500px) {
  .hints .hint:nth-child(n+3) { display: none; }
  .version { display: none; }
}

/* ── SCROLLBAR ────────────────────────────────── */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="logo">
    <img class="logo-img" src="data:image/png;base64,LOGO_PLACEHOLDER" alt="NotSteam logo">
    <div class="logo-wordmark">
      <span class="logo-not">NOT</span><span class="logo-steam">STEAM</span>
    </div>
  </div>
  <div class="topbar-right">
    <div id="input-mode" class="keyboard">
      <span id="input-mode-icon">⌨</span>
      <span id="input-mode-label">KEYBOARD</span>
    </div>
    <div class="status"><div class="status-dot"></div>EN LIGNE</div>
    <div id="clock">00:00</div>
  </div>
</header>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR (desktop) -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-label">Consoles</div>
    <div id="console-list"></div>
  </nav>

  <!-- CONTENT -->
  <div class="content">

    <!-- TABS (mobile) -->
    <div class="console-tabs" id="console-tabs"></div>

    <!-- HERO -->
    <div class="hero">
      <div class="hero-bg" id="hero-bg"></div>
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <div class="hero-info">
          <div class="hero-console-tag" id="hero-tag">NOTSTEAM OS</div>
          <div class="hero-title" id="hero-title">Choisir une console</div>
          <div class="hero-meta" id="hero-meta" style="display:none">
            <div class="hero-meta-item"><span id="hero-size">—</span></div>
            <div class="hero-meta-item" style="opacity:0.4">·</div>
            <div class="hero-meta-item"><span id="hero-file">—</span></div>
          </div>
          <div class="hero-hint" id="hero-hint">↵ ENTER pour lancer</div>
        </div>
      </div>
      <div class="loading-bar" id="loading-bar" style="width:0%"></div>
    </div>

    <!-- LIST HEADER -->
    <div class="list-header">
      <span class="list-title" id="list-title">—</span>
      <div class="list-right">
        <span class="list-stats" id="list-stats"></span>
        <div class="search-wrap">
          <span style="opacity:0.35; font-size:12px;">⌕</span>
          <input type="text" id="search-input" placeholder="Rechercher..." autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>

    <!-- GAME LIST -->
    <div class="game-list" id="game-list"></div>

  </div>
</div>

<!-- BOTTOM HINTS -->
<footer class="bottombar">
  <div class="hints" id="hints">
    <div class="hint"><span class="hkey">↑↓</span> Naviguer</div>
    <div class="hint"><span class="hkey">←→</span> Console</div>
    <div class="hint"><span class="hkey">↵</span> Lancer</div>
    <div class="hint" id="hint-gp" style="display:none"><span class="hkey">LB/RB</span> Console</div>
    <div class="hint" id="hint-gp2" style="display:none"><span class="hkey">A</span> Lancer</div>
  </div>
  <span class="version">NotSteam OS v2.2 · kevinraphael95</span>
</footer>

<!-- EMULATOR OVERLAY -->
<div id="emulator-overlay" class="hidden">
  <div class="emu-bar">
    <div class="emu-left">
      <img class="emu-logo" src="data:image/png;base64,LOGO_PLACEHOLDER" alt="">
      <span class="emu-badge" id="emu-badge"></span>
      <span class="emu-sep">|</span>
      <span class="emu-title-text" id="emu-title"></span>
    </div>
    <button class="btn-quit" id="quit-btn">✕ QUITTER</button>
  </div>
  <div id="display"></div>
</div>

<script>
'use strict';

const GH_USER = 'kevinraphael95';
const GH_REPO = 'notsteam';
const RAW = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/`;
const API = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/`;

const CONSOLES = [
  { id:'nes',  name:'NES',           short:'NES',  icon:'🕹️', ext:'.nes', core:'nes',  color:'#e04a3c', folder:'nes'  },
  { id:'snes', name:'Super NES',     short:'SNES', icon:'🎮', ext:'.sfc', core:'snes', color:'#4c6ef5', folder:'snes' },
  { id:'gb',   name:'Game Boy',      short:'GB',   icon:'📱', ext:'.gb',  core:'gb',   color:'#8bc34a', folder:'gb'   },
  { id:'gba',  name:'Game Boy Adv.', short:'GBA',  icon:'🎯', ext:'.gba', core:'gba',  color:'#ab47bc', folder:'gba'  },
  { id:'n64',  name:'Nintendo 64',   short:'N64',  icon:'🌀', ext:'.z64', core:'n64',  color:'#26a69a', folder:'n64'  },
  { id:'ps1',  name:'PlayStation 1', short:'PS1',  icon:'💿', ext:'.bin', core:'psx',  color:'#7986cb', folder:'ps1'  },
];

const state = {
  consoleIdx: 0,
  games: [],
  filtered: [],
  gameIdx: -1,
  loading: false,
  inputMode: 'keyboard',
  gpLastMove: 0,
  gpConnected: false,
};

const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);

// ── CLOCK
function tick() {
  $('clock').textContent = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}
tick(); setInterval(tick, 1000);

// ── INPUT MODE
const INPUT_META = {
  keyboard: { icon: '⌨', label: 'KEYBOARD', cls: 'keyboard' },
  mouse:    { icon: '⊙', label: 'MOUSE',    cls: 'mouse'    },
  gamepad:  { icon: '🕹', label: 'GAMEPAD',  cls: 'gamepad'  },
};
function setInputMode(mode) {
  if (state.inputMode === mode) return;
  state.inputMode = mode;
  const m = INPUT_META[mode];
  const el = $('input-mode');
  el.className = m.cls;
  $('input-mode-icon').textContent = m.icon;
  $('input-mode-label').textContent = m.label;
  const gpVis = mode === 'gamepad' ? '' : 'none';
  $('hint-gp').style.display = gpVis;
  $('hint-gp2').style.display = gpVis;
  updateHeroHint();
}
function updateHeroHint() {
  const hints = { keyboard:'↵ ENTER pour lancer', mouse:'CLIC pour lancer', gamepad:'A pour lancer' };
  const hint = $('hero-hint');
  if (state.gameIdx < 0) { hint.classList.add('hidden'); return; }
  hint.textContent = hints[state.inputMode] || hints.keyboard;
  hint.classList.remove('hidden');
}
document.addEventListener('mousemove', () => setInputMode('mouse'), { passive: true });
document.addEventListener('keydown', () => setInputMode('keyboard'), { passive: true });

// ── SIDEBAR + TABS
function renderSidebar() {
  $('console-list').innerHTML = CONSOLES.map((c, i) => `
    <div class="console-item ${i === state.consoleIdx ? 'active' : ''}"
         id="si-${c.id}"
         style="--accent:${c.color}"
         data-idx="${i}"
         onclick="pickConsole(${i})">
      <div class="console-icon" style="background:${c.color}1a;color:${c.color}">${c.icon}</div>
      <div class="console-info">
        <div class="console-name">${c.name}</div>
        <div class="console-count" id="cnt-${c.id}">—</div>
      </div>
    </div>`).join('');

  $('console-tabs').innerHTML = CONSOLES.map((c, i) => `
    <div class="tab-item ${i === state.consoleIdx ? 'active' : ''}"
         id="tab-${c.id}"
         style="--accent:${c.color};${i === state.consoleIdx ? 'border-bottom-color:'+c.color : ''}"
         onclick="pickConsole(${i})">
      <span class="tab-icon">${c.icon}</span>
      <span>${c.short}</span>
    </div>`).join('');
}

function updateSidebarActive() {
  $$('.console-item').forEach((el, i) => el.classList.toggle('active', i === state.consoleIdx));
  $$('.tab-item').forEach((el, i) => {
    el.classList.toggle('active', i === state.consoleIdx);
    if (i === state.consoleIdx) el.style.borderBottomColor = CONSOLES[i].color;
    else el.style.borderBottomColor = '';
  });
  // Scroll tab into view on mobile
  const activeTab = document.getElementById('tab-' + CONSOLES[state.consoleIdx].id);
  if (activeTab) activeTab.scrollIntoView({ inline: 'center', block: 'nearest' });
}

// ── CONSOLE PICK
async function pickConsole(idx) {
  if (state.loading || (idx === state.consoleIdx && state.games.length > 0)) return;
  state.consoleIdx = idx;
  state.games = [];
  state.filtered = [];
  state.gameIdx = -1;

  const c = CONSOLES[idx];
  document.documentElement.style.setProperty('--accent', c.color);
  updateSidebarActive();

  $('hero-tag').textContent = c.name.toUpperCase();
  $('hero-tag').style.color = c.color;
  $('hero-title').textContent = 'Scan en cours…';
  $('hero-meta').style.display = 'none';
  $('hero-hint').classList.add('hidden');
  $('list-title').textContent = c.name;
  $('list-stats').textContent = '';
  $('game-list').innerHTML = '';
  $('search-input').value = '';

  setLoading(true);
  await fetchRoms(c);
  setLoading(false);
}

// ── FETCH ROMS
async function fetchRoms(c) {
  state.loading = true;
  try {
    const r = await fetch(API + c.folder);
    if (!r.ok) throw new Error(r.status);
    const files = await r.json();
    state.games = files
      .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith(c.ext))
      .map(f => ({
        title: f.name.slice(0, -c.ext.length).replace(/_/g,' '),
        file: f.name,
        size: f.size,
      }));
    $('cnt-' + c.id).textContent = `${state.games.length} ROM${state.games.length !== 1 ? 's' : ''}`;
  } catch {
    state.games = [];
    $('cnt-' + CONSOLES[state.consoleIdx].id).textContent = '0 ROMs';
  }
  state.loading = false;
  state.filtered = [...state.games];
  renderGames();
  if (state.filtered.length > 0) focusGame(0, false);
  else $('hero-title').textContent = 'Aucun jeu';
}

// ── RENDER GAMES
function renderGames() {
  const c = CONSOLES[state.consoleIdx];
  $('list-stats').textContent = `${state.filtered.length} jeu${state.filtered.length !== 1 ? 'x' : ''}`;

  if (!state.filtered.length) {
    $('game-list').innerHTML = `<div class="empty-state">
      <div class="empty-icon">${state.games.length ? '🔍' : '📦'}</div>
      <div class="empty-title">${state.games.length ? 'Aucun résultat' : 'Dossier vide'}</div>
      <div class="empty-sub">${state.games.length ? 'Modifie ta recherche' : '/' + c.folder + '/ est vide sur GitHub'}</div>
    </div>`;
    return;
  }

  const hint = state.inputMode === 'gamepad' ? 'A LANCER' : '↵ LANCER';
  $('game-list').innerHTML = state.filtered.map((g, i) => `
    <div class="game-row ${i === state.gameIdx ? 'focused' : ''}"
         id="gr-${i}"
         data-idx="${i}"
         data-hint="${hint}"
         tabindex="-1"
         onclick="launchGame(${i})"
         onmouseenter="if(state.inputMode==='mouse')focusGame(${i},false)">
      <div class="game-thumb" style="background:${c.color}18;color:${c.color}">${c.icon}</div>
      <div class="game-meta">
        <div class="game-name">${g.title}</div>
        <div class="game-sub">${c.short} · ${g.file}</div>
      </div>
      <div class="game-size">${fmtSize(g.size)}</div>
    </div>`).join('');
}

// ── FOCUS GAME
function focusGame(i, scroll = true) {
  state.gameIdx = i;
  const g = state.filtered[i];
  if (!g) return;
  const c = CONSOLES[state.consoleIdx];

  $('hero-title').textContent = g.title;
  $('hero-tag').textContent = c.name.toUpperCase();
  $('hero-bg').style.background = `radial-gradient(ellipse at 75% 50%, ${c.color}1e 0%, transparent 70%)`;
  $('hero-meta').style.display = 'flex';
  $('hero-size').textContent = fmtSize(g.size);
  $('hero-file').textContent = g.file;
  updateHeroHint();

  $$('.game-row').forEach((el, idx) => el.classList.toggle('focused', idx === i));
  if (scroll) {
    const row = $('gr-' + i);
    if (row) row.scrollIntoView({ block: 'nearest' });
  }
}

// ── LAUNCH
function launchGame(i) {
  const g = state.filtered[i ?? state.gameIdx];
  const c = CONSOLES[state.consoleIdx];
  if (!g || !c) return;

  const overlay = $('emulator-overlay');
  overlay.classList.remove('hidden');
  $('emu-title').textContent = g.title;
  const badge = $('emu-badge');
  badge.textContent = c.short;
  badge.style.background = c.color + '28';
  badge.style.color = c.color;
  badge.style.border = `1px solid ${c.color}55`;

  const prev = document.getElementById('ejs-script');
  if (prev) prev.remove();
  $('display').innerHTML = '';

  window.EJS_player        = '#display';
  window.EJS_core          = c.core;
  window.EJS_gameUrl       = RAW + c.folder + '/' + encodeURIComponent(g.file);
  window.EJS_pathtodata    = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  window.EJS_gamepadEnabled = true;

  const s = document.createElement('script');
  s.id = 'ejs-script';
  s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
  document.head.appendChild(s);
}

// ── QUIT
$('quit-btn').addEventListener('click', () => {
  // 1. Cacher l'overlay
  $('emulator-overlay').classList.add('hidden');
  
  // 2. Arrêter l'émulateur s'il existe
  if (window.EJS_emulator) {
    window.EJS_emulator.stop(); // Arrête la boucle de jeu et le son
    window.EJS_emulator = null;
  }
  
  // 3. Nettoyer le conteneur et le script
  $('display').innerHTML = '';
  const s = document.getElementById('ejs-script');
  if (s) s.remove();
  
  // 4. Supprimer les variables globales EJS
  ['EJS_player','EJS_core','EJS_gameUrl','EJS_pathtodata','EJS_startOnLoaded','EJS_gamepadEnabled']
    .forEach(k => delete window[k]);
});

// ── SEARCH
$('search-input').addEventListener('input', () => {
  const q = $('search-input').value.toLowerCase().trim();
  state.filtered = q
    ? state.games.filter(g => g.title.toLowerCase().includes(q) || g.file.toLowerCase().includes(q))
    : [...state.games];
  state.gameIdx = -1;
  renderGames();
  if (state.filtered.length > 0) focusGame(0, false);
});

// ── KEYBOARD NAV
document.addEventListener('keydown', e => {
  if ($('emulator-overlay') && !$('emulator-overlay').classList.contains('hidden')) return;
  if (document.activeElement === $('search-input')) {
    if (e.key === 'Escape') {
      $('search-input').blur();
      $('search-input').value = '';
      $('search-input').dispatchEvent(new Event('input'));
    }
    return;
  }
  const handled = {
    'ArrowUp':    () => { if (state.gameIdx > 0) focusGame(state.gameIdx - 1); },
    'ArrowDown':  () => { if (state.gameIdx < state.filtered.length - 1) focusGame(state.gameIdx + 1); },
    'ArrowLeft':  () => { if (state.consoleIdx > 0) pickConsole(state.consoleIdx - 1); },
    'ArrowRight': () => { if (state.consoleIdx < CONSOLES.length - 1) pickConsole(state.consoleIdx + 1); },
    'Enter':      () => { if (state.gameIdx >= 0) launchGame(state.gameIdx); },
    '/':          () => { $('search-input').focus(); },
    'f':          () => { $('search-input').focus(); },
  };
  if (handled[e.key]) {
    if (!['/', 'f'].includes(e.key)) e.preventDefault();
    handled[e.key]();
  }
});

// ── GAMEPAD
window.addEventListener('gamepadconnected', e => {
  state.gpConnected = true;
  setInputMode('gamepad');
});
window.addEventListener('gamepaddisconnected', () => {
  state.gpConnected = false;
  setInputMode('keyboard');
});
function pollGamepad() {
  const gp = navigator.getGamepads ? navigator.getGamepads()[0] : null;
  if (!gp || ($('emulator-overlay') && !$('emulator-overlay').classList.contains('hidden'))) return;
  const anyPressed = gp.buttons.some(b => b.pressed) || gp.axes.some(a => Math.abs(a) > 0.5);
  if (anyPressed) setInputMode('gamepad');
  const now = Date.now();
  if (now - state.gpLastMove < 180) return;
  const up    = gp.axes[1] < -0.5 || gp.buttons[12]?.pressed;
  const down  = gp.axes[1] >  0.5 || gp.buttons[13]?.pressed;
  const left  = gp.axes[0] < -0.5 || gp.buttons[14]?.pressed;
  const right = gp.axes[0] >  0.5 || gp.buttons[15]?.pressed;
  const lb    = gp.buttons[4]?.pressed;
  const rb    = gp.buttons[5]?.pressed;
  const a     = gp.buttons[0]?.pressed;
  if (up)         { if (state.gameIdx > 0) { focusGame(state.gameIdx - 1); state.gpLastMove = now; } }
  if (down)       { if (state.gameIdx < state.filtered.length - 1) { focusGame(state.gameIdx + 1); state.gpLastMove = now; } }
  if (lb || left) { if (state.consoleIdx > 0) { pickConsole(state.consoleIdx - 1); state.gpLastMove = now; } }
  if (rb || right){ if (state.consoleIdx < CONSOLES.length - 1) { pickConsole(state.consoleIdx + 1); state.gpLastMove = now; } }
  if (a && state.gameIdx >= 0) { launchGame(state.gameIdx); state.gpLastMove = now; }
}
setInterval(pollGamepad, 16);

// ── LOADING BAR
let _loadTimer = null;
function setLoading(on) {
  const bar = $('loading-bar');
  clearInterval(_loadTimer);
  if (on) {
    let w = 0;
    bar.style.transition = 'width 0.2s ease';
    bar.style.width = '0%';
    _loadTimer = setInterval(() => { w = Math.min(w + Math.random() * 12, 88); bar.style.width = w + '%'; }, 100);
  } else {
    bar.style.transition = 'width 0.3s ease';
    bar.style.width = '100%';
    setTimeout(() => { bar.style.transition = 'none'; bar.style.width = '0%'; }, 350);
  }
}

// ── UTILS
function fmtSize(b) {
  if (!b) return '—';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

// ── BOOT
renderSidebar();
pickConsole(0);
</script>
</body>
</html>'''
