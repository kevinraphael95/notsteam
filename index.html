<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NotSteam OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button,input{font-family:inherit;border:none;cursor:pointer;outline:none}

:root {
  --bg:      #07080d;
  --s1:      #0d0e17;
  --s2:      #12131f;
  --s3:      #181928;
  --border:  rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.12);
  --text:    #dde2f0;
  --muted:   #5c6380;
  --accent:  #e0463a;
  --blue:    #4f8ef7;
  --cyan:    #2ec4d6;
  --green:   #3dba6f;
  --mono:    'JetBrains Mono', monospace;
  --sans:    'Rajdhani', sans-serif;
  --r:       4px;
  --ease:    cubic-bezier(0.25,0.46,0.45,0.94);
}

html,body{height:100%;overflow:hidden}
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  display: flex;
  flex-direction: column;
  height: 100vh;
  user-select: none;
}

/* scanlines subtiles */
body::before {
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.03) 3px,rgba(0,0,0,0.03) 4px);
}

/* ── TOPBAR ── */
.topbar {
  height: 50px;
  background: var(--s1);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  flex-shrink: 0;
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 5px;
  text-transform: uppercase;
}
.logo img { width: 26px; height: 26px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(224,70,58,0.6)); }
.logo-not   { color: var(--accent); }
.logo-dot   { width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);animation:blink 2.5s ease-in-out infinite; }
.logo-steam { color: var(--text); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

.topbar-right {
  display: flex;
  align-items: center;
  gap: 18px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}
.status-dot { width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green);animation:blink 2.5s ease-in-out infinite; }
#clock { color: var(--text); font-size: 13px; }

/* ── LAYOUT ── */
.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 200px;
  background: var(--s1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  scrollbar-width: none;
}
.sidebar-label {
  padding: 14px 14px 8px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}
.console-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: background 120ms var(--ease), border-color 120ms;
}
.console-item:hover { background: rgba(255,255,255,0.04); }
.console-item.active { background: rgba(255,255,255,0.06); border-left-color: var(--c-color,var(--accent)); }

.console-icon {
  width: 32px; height: 32px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.console-name { font-size: 13px; font-weight: 600; color: #8a93b0; }
.console-item.active .console-name { color: var(--text); }
.console-count { font-family: var(--mono); font-size: 10px; color: var(--muted); }

/* ── CONTENT ── */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HERO ── */
.hero {
  height: 190px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
}
.hero-bg { position: absolute; inset: 0; transition: background 300ms var(--ease); }
.hero-gradient {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(7,8,13,1) 30%, rgba(7,8,13,.6) 70%, rgba(7,8,13,.1) 100%);
}
.hero-content {
  position: absolute; inset: 0;
  display: flex; align-items: flex-end;
  padding: 22px 26px;
}
.hero-tag {
  font-family: var(--mono);
  font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
}
.hero-title {
  font-size: 30px; font-weight: 700; line-height: 1.05;
  margin-bottom: 10px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 480px;
}
.hero-meta {
  display: flex; gap: 12px;
  font-family: var(--mono); font-size: 10px; color: var(--muted);
  margin-bottom: 12px;
}
.hero-launch {
  display: none;
  align-items: center; gap: 8px;
  background: var(--accent);
  color: #fff;
  padding: 8px 20px;
  border-radius: var(--r);
  font-family: var(--sans); font-size: 13px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase;
  box-shadow: 0 2px 16px rgba(224,70,58,.4);
  cursor: pointer;
  transition: background 120ms, transform 120ms, box-shadow 120ms;
  width: fit-content;
}
.hero-launch:hover { background: #c73028; transform: translateY(-1px); box-shadow: 0 4px 22px rgba(224,70,58,.5); }
.hero-launch:active { transform: translateY(0); }
.hero-launch.visible { display: flex; }

.loading-bar {
  position: absolute; bottom: 0; left: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--cyan));
  box-shadow: 0 0 8px var(--accent);
  border-radius: 0 1px 1px 0;
}

/* ── LIST HEADER ── */
.list-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--s1);
}
.list-title { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.list-right { display: flex; align-items: center; gap: 10px; }
.list-stats { font-family: var(--mono); font-size: 10px; color: var(--muted); }

.search-wrap {
  display: flex; align-items: center; gap: 6px;
  background: var(--s3); border: 1px solid var(--border);
  border-radius: var(--r); padding: 5px 9px;
  transition: border-color 120ms;
}
.search-wrap:focus-within { border-color: rgba(79,142,247,.4); }
.search-wrap input { background: none; color: var(--text); font-family: var(--mono); font-size: 11px; width: 130px; }
.search-wrap input::placeholder { color: var(--muted); }

/* ── GAME LIST ── */
.game-list {
  flex: 1; overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.07) transparent;
}
.game-row {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 20px;
  border-bottom: 1px solid var(--border);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background 100ms;
}
.game-row:hover { background: rgba(255,255,255,0.035); }
.game-row.focused { background: rgba(255,255,255,.055); border-left-color: var(--c-color, var(--accent)); }

.game-thumb {
  width: 42px; height: 32px; border-radius: var(--r);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
  border: 1px solid rgba(255,255,255,.06);
}
.game-info { flex: 1; min-width: 0; }
.game-name { font-size: 13px; font-weight: 600; color: #b0bad4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.game-row.focused .game-name { color: var(--text); }
.game-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 1px; }
.game-size { font-family: var(--mono); font-size: 10px; color: var(--muted); flex-shrink: 0; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 8px; color: var(--muted); }
.empty-icon { font-size: 36px; opacity: .2; }
.empty-title { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
.empty-sub { font-family: var(--mono); font-size: 10px; opacity: .5; }

/* ── BOTTOMBAR ── */
.bottombar {
  height: 36px;
  background: var(--s1); border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; flex-shrink: 0;
  font-family: var(--mono); font-size: 10px; color: var(--muted);
}
.hints { display: flex; gap: 14px; align-items: center; }
.hint { display: flex; align-items: center; gap: 5px; }
.hkey {
  background: var(--s3); border: 1px solid var(--border2);
  border-radius: 3px; padding: 1px 6px; font-size: 10px;
  color: rgba(255,255,255,.5); font-weight: 700; min-width: 20px; text-align: center;
}
.version { font-size: 9px; opacity: .3; letter-spacing: 1px; }

/* ── EMULATOR OVERLAY ── */
#emulator-overlay {
  position: fixed; inset: 0;
  background: #000;
  z-index: 1000;
  display: flex; flex-direction: column;
  animation: fadeIn .15s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
#emulator-overlay.hidden { display: none !important; }

.emu-bar {
  height: 44px;
  background: rgba(8,9,15,.98); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; flex-shrink: 0; z-index: 10;
}
.emu-left { display: flex; align-items: center; gap: 10px; }
.emu-badge {
  font-family: var(--mono); font-size: 9px; letter-spacing: 2px; font-weight: 600;
  padding: 3px 8px; border-radius: 3px;
}
.emu-title-text { font-size: 13px; font-weight: 600; }
.btn-quit {
  display: flex; align-items: center; gap: 6px;
  background: rgba(224,70,58,.12); color: var(--accent);
  border: 1px solid rgba(224,70,58,.25); border-radius: var(--r);
  padding: 6px 14px;
  font-family: var(--sans); font-weight: 700; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
  transition: background 120ms, border-color 120ms;
}
.btn-quit:hover { background: rgba(224,70,58,.25); border-color: rgba(224,70,58,.5); }

/* Le display prend TOUT l'espace restant avec height fixe */
#display {
  flex: 1;
  width: 100%;
  min-height: 0;
  overflow: hidden;
  position: relative;
}
/* Force EmulatorJS à remplir le conteneur */
#display > * { width: 100% !important; height: 100% !important; }
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="logo">
    <img src="notsteam.png" alt="">
    <span class="logo-not">NOT</span>
    <div class="logo-dot"></div>
    <span class="logo-steam">STEAM</span>
  </div>
  <div class="topbar-right">
    <div style="display:flex;align-items:center;gap:6px;"><div class="status-dot"></div>EN LIGNE</div>
    <div id="clock">00:00</div>
  </div>
</header>

<!-- LAYOUT -->
<div class="layout">

  <nav class="sidebar">
    <div class="sidebar-label">Consoles</div>
    <div id="console-list"></div>
  </nav>

  <div class="content">

    <div class="hero">
      <div class="hero-bg" id="hero-bg"></div>
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <div>
          <div class="hero-tag" id="hero-tag">NOTSTEAM OS</div>
          <div class="hero-title" id="hero-title">Choisir un jeu</div>
          <div class="hero-meta" id="hero-meta" style="display:none">
            <span id="hero-size">—</span>
            <span style="opacity:.3">·</span>
            <span id="hero-file">—</span>
          </div>
          <button class="hero-launch" id="hero-launch" onclick="launchSelected()">▶ LANCER</button>
        </div>
      </div>
      <div class="loading-bar" id="loading-bar" style="width:0%"></div>
    </div>

    <div class="list-header">
      <span class="list-title" id="list-title">—</span>
      <div class="list-right">
        <span class="list-stats" id="list-stats"></span>
        <div class="search-wrap">
          <span style="opacity:.4;font-size:13px">⌕</span>
          <input type="text" id="search-input" placeholder="Rechercher..." autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>

    <div class="game-list" id="game-list"></div>

  </div>
</div>

<footer class="bottombar">
  <div class="hints">
    <div class="hint"><span class="hkey">↑↓</span>Naviguer</div>
    <div class="hint"><span class="hkey">←→</span>Console</div>
    <div class="hint"><span class="hkey">↵</span>Lancer</div>
    <div class="hint"><span class="hkey">/</span>Chercher</div>
  </div>
  <span class="version">NotSteam OS v2.2 · kevinraphael95</span>
</footer>

<!-- EMULATOR OVERLAY -->
<div id="emulator-overlay" class="hidden">
  <div class="emu-bar">
    <div class="emu-left">
      <span class="emu-badge" id="emu-badge"></span>
      <span style="color:var(--border2)">|</span>
      <span class="emu-title-text" id="emu-title"></span>
    </div>
    <button class="btn-quit" id="quit-btn">✕ Quitter</button>
  </div>
  <div id="display"></div>
</div>

<script>
'use strict';

const GH_USER = 'kevinraphael95';
const GH_REPO = 'notsteam';
const API = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/`;
const RAW = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/`;

const CONSOLES = [
  { id:'nes',  name:'NES',           short:'NES',  icon:'🕹️', ext:'.nes', core:'nes',  color:'#e04a3c', folder:'nes'  },
  { id:'gba',  name:'Game Boy Adv.', short:'GBA',  icon:'🎮', ext:'.gba', core:'gba',  color:'#7c5cbf', folder:'gba'  },
  { id:'snes', name:'Super NES',     short:'SNES', icon:'🎯', ext:'.sfc', core:'snes', color:'#4c6ef5', folder:'snes' },
  { id:'gb',   name:'Game Boy',      short:'GB',   icon:'📱', ext:'.gb',  core:'gb',   color:'#6aaa3c', folder:'gb'   },
  { id:'n64',  name:'Nintendo 64',   short:'N64',  icon:'🌀', ext:'.z64', core:'n64',  color:'#26a69a', folder:'n64'  },
  { id:'ps1',  name:'PlayStation',   short:'PS1',  icon:'💿', ext:'.bin', core:'psx',  color:'#5c7ccc', folder:'ps1'  },
];

const state = { idx: 0, games: [], filtered: [], gameIdx: -1, loading: false, gpLast: 0 };

const $ = id => document.getElementById(id);
const $$ = s => document.querySelectorAll(s);

// CLOCK
setInterval(() => {
  $('clock').textContent = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});
}, 1000);
$('clock').textContent = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});

// SIDEBAR
function renderSidebar() {
  $('console-list').innerHTML = CONSOLES.map((c, i) => `
    <div class="console-item ${i===0?'active':''}" id="si-${c.id}" onclick="pickConsole(${i})"
         style="--c-color:${c.color}">
      <div class="console-icon" style="background:${c.color}1a;color:${c.color}">${c.icon}</div>
      <div>
        <div class="console-name">${c.name}</div>
        <div class="console-count" id="cnt-${c.id}">—</div>
      </div>
    </div>`).join('');
}

function updateSidebar() {
  $$('.console-item').forEach((el, i) => el.classList.toggle('active', i === state.idx));
}

async function pickConsole(i) {
  if (state.loading) return;
  state.idx = i;
  state.games = []; state.filtered = []; state.gameIdx = -1;

  const c = CONSOLES[i];
  updateSidebar();
  document.documentElement.style.setProperty('--accent', c.color);

  $('hero-tag').textContent = c.name.toUpperCase();
  $('hero-tag').style.color = c.color;
  $('hero-title').textContent = 'Scan en cours…';
  $('hero-meta').style.display = 'none';
  $('hero-launch').classList.remove('visible');
  $('list-title').textContent = c.name;
  $('list-stats').textContent = '';
  $('game-list').innerHTML = '';
  $('search-input').value = '';

  setLoading(true);
  try {
    const r = await fetch(API + c.folder);
    if (!r.ok) throw new Error(r.status);
    const files = await r.json();
    state.games = files
      .filter(f => f.type==='file' && f.name.toLowerCase().endsWith(c.ext))
      .map(f => ({ title: f.name.slice(0,-c.ext.length).replace(/_/g,' '), file: f.name, size: f.size }));
    $(`cnt-${c.id}`).textContent = `${state.games.length} ROM${state.games.length!==1?'s':''}`;
  } catch {
    state.games = [];
  }
  setLoading(false);

  state.filtered = [...state.games];
  renderGames();
  if (state.filtered.length > 0) focusGame(0, false);
  else $('hero-title').textContent = 'Aucun jeu';
}

function renderGames() {
  const c = CONSOLES[state.idx];
  $('list-stats').textContent = `${state.filtered.length} jeu${state.filtered.length!==1?'x':''}`;
  if (!state.filtered.length) {
    $('game-list').innerHTML = `<div class="empty-state">
      <div class="empty-icon">${state.games.length?'🔍':'📦'}</div>
      <div class="empty-title">${state.games.length?'Aucun résultat':'Dossier vide'}</div>
      <div class="empty-sub">${state.games.length?'Modifie ta recherche':'/'+c.folder+'/ est vide'}</div>
    </div>`;
    return;
  }
  $('game-list').innerHTML = state.filtered.map((g, i) => `
    <div class="game-row ${i===state.gameIdx?'focused':''}" id="gr-${i}" data-idx="${i}"
         style="--c-color:${c.color}"
         onclick="launchGame(${i})" onmouseenter="focusGame(${i},false)">
      <div class="game-thumb" style="background:${c.color}18;color:${c.color}">${c.icon}</div>
      <div class="game-info">
        <div class="game-name">${g.title}</div>
        <div class="game-sub">${c.short} · ${g.file}</div>
      </div>
      <div class="game-size">${fmtSize(g.size)}</div>
    </div>`).join('');
}

function focusGame(i, scroll=true) {
  state.gameIdx = i;
  const g = state.filtered[i]; if (!g) return;
  const c = CONSOLES[state.idx];
  $('hero-title').textContent = g.title;
  $('hero-tag').textContent = c.name.toUpperCase();
  $('hero-bg').style.background = `radial-gradient(ellipse at 80% 50%, ${c.color}22 0%, transparent 65%)`;
  $('hero-meta').style.display = 'flex';
  $('hero-size').textContent = fmtSize(g.size);
  $('hero-file').textContent = g.file;
  $('hero-launch').classList.add('visible');
  $$('.game-row').forEach((el,idx) => el.classList.toggle('focused', idx===i));
  if (scroll) { const row = $(`gr-${i}`); if (row) row.scrollIntoView({block:'nearest'}); }
}

function launchSelected() { if (state.gameIdx >= 0) launchGame(state.gameIdx); }

function launchGame(i) {
  const g = state.filtered[i ?? state.gameIdx];
  const c = CONSOLES[state.idx];
  if (!g || !c) return;

  // Clean previous
  try { if (window.EJS_emulator) window.EJS_emulator.exit(); } catch {}
  const prev = document.getElementById('ejs-script');
  if (prev) prev.remove();
  const oldDisplay = $('display');
  const freshDisplay = document.createElement('div');
  freshDisplay.id = 'display';
  oldDisplay.parentNode.replaceChild(freshDisplay, oldDisplay);
  document.querySelectorAll('[id^="emulator"], [class*="emulator"]').forEach(el => {
    if (el.id !== 'emulator-overlay') el.remove();
  });
  ['EJS_player','EJS_core','EJS_gameUrl','EJS_pathtodata','EJS_startOnLoaded','EJS_gamepadEnabled','EJS_emulator']
    .forEach(k => { try { delete window[k]; } catch {} });

  // Show overlay FIRST (display needs real dimensions)
  $('emulator-overlay').classList.remove('hidden');
  $('emu-title').textContent = g.title;
  const badge = $('emu-badge');
  badge.textContent = c.short;
  badge.style.background = c.color + '28';
  badge.style.color = c.color;
  badge.style.border = `1px solid ${c.color}55`;

  // Config EJS après que le DOM soit peint (dimensions réelles)
  requestAnimationFrame(() => requestAnimationFrame(() => {
    window.EJS_player        = '#display';
    window.EJS_core          = c.core;
    window.EJS_gameUrl       = RAW + c.folder + '/' + encodeURIComponent(g.file);
    window.EJS_pathtodata    = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_gamepadEnabled= true;

    const s = document.createElement('script');
    s.id  = 'ejs-script';
    s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js?t=' + Date.now();
    document.head.appendChild(s);
  }));
}

$('quit-btn').addEventListener('click', () => {
  // Stop audio context si dispo
  try { if (window.EJS_emulator) window.EJS_emulator.exit(); } catch {}

  // Nettoie le script loader
  const s = document.getElementById('ejs-script');
  if (s) s.remove();

  // Détruit et recrée #display — coupe tous les listeners EJS
  const old = $('display');
  const fresh = document.createElement('div');
  fresh.id = 'display';
  old.parentNode.replaceChild(fresh, old);

  // Nettoie tous les éléments parasites injectés par EJS hors #display
  document.querySelectorAll('[id^="emulator"], [class*="emulator"]').forEach(el => {
    if (el.id !== 'emulator-overlay') el.remove();
  });

  // Reset globals EJS
  ['EJS_player','EJS_core','EJS_gameUrl','EJS_pathtodata','EJS_startOnLoaded','EJS_gamepadEnabled','EJS_emulator']
    .forEach(k => { try { delete window[k]; } catch {} });

  $('emulator-overlay').classList.add('hidden');
});

$('search-input').addEventListener('input', () => {
  const q = $('search-input').value.toLowerCase().trim();
  state.filtered = q ? state.games.filter(g => g.title.toLowerCase().includes(q) || g.file.toLowerCase().includes(q)) : [...state.games];
  state.gameIdx = -1;
  renderGames();
  if (state.filtered.length > 0) focusGame(0, false);
});

document.addEventListener('keydown', e => {
  if (!$('emulator-overlay').classList.contains('hidden')) return;
  if (document.activeElement === $('search-input')) {
    if (e.key === 'Escape') { $('search-input').blur(); $('search-input').value=''; $('search-input').dispatchEvent(new Event('input')); }
    return;
  }
  const map = {
    ArrowUp:    () => { if (state.gameIdx > 0) focusGame(state.gameIdx-1); },
    ArrowDown:  () => { if (state.gameIdx < state.filtered.length-1) focusGame(state.gameIdx+1); },
    ArrowLeft:  () => { if (state.idx > 0) pickConsole(state.idx-1); },
    ArrowRight: () => { if (state.idx < CONSOLES.length-1) pickConsole(state.idx+1); },
    Enter:      () => { if (state.gameIdx >= 0) launchGame(state.gameIdx); },
    '/':        () => $('search-input').focus(),
  };
  if (map[e.key]) { if (!['/', 'f'].includes(e.key)) e.preventDefault(); map[e.key](); }
});

// GAMEPAD
window.addEventListener('gamepadconnected', e => { console.log('[NotSteam] Manette:', e.gamepad.id); });
function pollGamepad() {
  const gp = navigator.getGamepads?.()[0];
  if (!gp || !$('emulator-overlay').classList.contains('hidden')) return;
  const now = Date.now();
  if (now - state.gpLast < 180) return;
  const up    = gp.axes[1]<-0.5 || gp.buttons[12]?.pressed;
  const down  = gp.axes[1]> 0.5 || gp.buttons[13]?.pressed;
  const left  = gp.axes[0]<-0.5 || gp.buttons[14]?.pressed;
  const right = gp.axes[0]> 0.5 || gp.buttons[15]?.pressed;
  const lb    = gp.buttons[4]?.pressed;
  const rb    = gp.buttons[5]?.pressed;
  const a     = gp.buttons[0]?.pressed;
  if (up)          { if (state.gameIdx>0) { focusGame(state.gameIdx-1); state.gpLast=now; } }
  if (down)        { if (state.gameIdx<state.filtered.length-1) { focusGame(state.gameIdx+1); state.gpLast=now; } }
  if (lb||left)    { if (state.idx>0) { pickConsole(state.idx-1); state.gpLast=now; } }
  if (rb||right)   { if (state.idx<CONSOLES.length-1) { pickConsole(state.idx+1); state.gpLast=now; } }
  if (a && state.gameIdx>=0) { launchGame(state.gameIdx); state.gpLast=now; }
}
setInterval(pollGamepad, 16);

// LOADING BAR
let _lt = null;
function setLoading(on) {
  const bar = $('loading-bar'); clearInterval(_lt);
  if (on) {
    let w = 0; bar.style.transition='width .2s ease'; bar.style.width='0%';
    _lt = setInterval(() => { w = Math.min(w+Math.random()*12,88); bar.style.width=w+'%'; }, 100);
  } else {
    bar.style.transition='width .3s ease'; bar.style.width='100%';
    setTimeout(() => { bar.style.transition='none'; bar.style.width='0%'; }, 360);
  }
}

function fmtSize(b) {
  if (!b) return '—';
  if (b<1024) return b+' B';
  if (b<1048576) return (b/1024).toFixed(0)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}

renderSidebar();
pickConsole(0);
</script>
