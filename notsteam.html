<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NotSteam OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="steam-deck-ui">

    <header class="top-bar">
        <div class="brand italic">NOT<span class="text-blue">STEAM</span></div>
        <div id="clock" class="time">00:00</div>
    </header>

    <main id="main-view">
        <section class="shelf">
            <h2 class="section-label">RÉCENT</h2>
            <div class="game-carousel" id="game-list">
                </div>
        </section>
    </main>

    <div id="emulator-overlay" class="hidden">
        <div class="emu-header">
            <span id="playing-title">Chargement...</span>
            <button onclick="location.reload()" class="exit-btn">QUITTER (ESC)</button>
        </div>
        <div id="display"></div>
    </div>

    <footer class="bottom-bar">
        <div class="hints">
            <span class="badge">STEAM</span>
            <span>MENU</span>
        </div>
        <div class="controller-hints">
            <span><b class="btn-a">A</b> Sélectionner</span>
            <span><b class="btn-b">B</b> Retour</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
