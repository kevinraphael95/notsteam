<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NotSteam OS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="deck-bg text-white font-sans overflow-hidden select-none">

    <header class="flex justify-between items-center px-12 py-6">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-blue-400 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-black tracking-tighter italic">NotSteam</h1>
        </div>
        <div id="clock" class="text-sm font-bold opacity-60">00:00</div>
    </header>

    <main id="library-screen" class="px-12 mt-4">
        <h2 class="text-2xl font-bold mb-6 opacity-90">Ma Bibliothèque</h2>
        
        <div class="flex gap-4 items-start overflow-x-auto pb-12 scrollbar-none" id="main-carousel">
            
            <div class="flex flex-col gap-4">
                <button class="tile-main focused" 
                        data-core="snes" 
                        data-path="snes/game.sfc" 
                        data-name="Super Nintendo" 
                        data-focusable="true">
                    <div class="tile-art snes-art"></div>
                    <div class="verified-tag">✅ NotSteam Verified</div>
                </button>
                <div class="tile-meta">
                    <h3 class="text-2xl font-bold">Super Nintendo</h3>
                    <p class="text-green-400 text-[10px] font-black uppercase tracking-widest mt-1">▶ Prêt à jouer</p>
                </div>
            </div>

            <button class="tile-sub" data-core="nes" data-path="nes/game.nes" data-name="Nintendo NES" data-focusable="true">
                <div class="tile-art nes-art"></div>
            </button>

            <button class="tile-sub" data-core="segaMD" data-path="megadrive/game.md" data-name="Sega Megadrive" data-focusable="true">
                <div class="tile-art sega-art"></div>
            </button>

            <button class="tile-sub" data-core="amiga" data-path="amiga/game.adf" data-name="Amiga 500" data-focusable="true">
                <div class="tile-art amiga-art"></div>
            </button>

            <button class="tile-sub" data-core="psx" data-path="psx/game.chd" data-name="PlayStation 1" data-focusable="true">
                <div class="tile-art ps1-art"></div>
            </button>

        </div>
    </main>

    <section id="player-screen" class="hidden fixed inset-0 bg-black z-50 flex flex-col">
        <div class="h-14 flex justify-between items-center px-8 bg-[#10151e] border-b border-white/5">
            <span id="target-name" class="font-black text-blue-400 uppercase text-xs tracking-widest"></span>
            <button onclick="location.reload()" class="bg-red-600 px-5 py-1.5 rounded text-[10px] font-black uppercase">Fermer (ESC)</button>
        </div>
        <div id="emu-box" class="flex-grow"></div>
    </section>

    <footer class="fixed bottom-0 w-full h-14 bg-black/80 backdrop-blur-md px-10 flex justify-between items-center text-[10px] font-bold text-gray-400 border-t border-white/5">
        <div class="flex gap-4">
            <span class="bg-white/10 px-3 py-1 rounded-full text-white tracking-tighter">NOTSTEAM</span>
            <span class="flex items-center">MENU</span>
        </div>
        <div class="flex gap-6 items-center">
            <span>☰ OPTIONS</span>
            <span><b class="btn-icon">A</b> SELECT</span>
            <span><b class="btn-icon">B</b> BACK</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
