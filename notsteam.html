<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NotSteam OS</title>
    <style>
        :root { --bg: #0a0f14; --steam-blue: #1b2838; --sky: #66c0f4; }
        body { 
            margin: 0; background: radial-gradient(circle at 50% 30%, #1c2e4a 0%, var(--bg) 80%);
            color: white; font-family: sans-serif; overflow: hidden; height: 100vh;
        }
        .top-bar { display: flex; justify-content: space-between; padding: 25px 50px; font-weight: bold; background: rgba(0,0,0,0.4); }
        .shelf { padding: 40px; }
        .game-carousel { display: flex; gap: 20px; overflow-x: auto; padding: 20px 0; scrollbar-width: none; }
        
        /* CARTES DYNAMIQUES */
        .game-card {
            min-width: 220px; height: 320px; background: #1a222d; border-radius: 6px;
            border: 3px solid transparent; transition: 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            cursor: pointer; display: flex; align-items: flex-end; padding: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .game-card:focus, .game-card.active {
            border-color: white; transform: scale(1.05); outline: none;
            box-shadow: 0 0 30px rgba(102, 192, 244, 0.4);
        }

        #emulator-overlay { position: fixed; inset: 0; background: black; z-index: 1000; display: flex; flex-direction: column; }
        #display { flex-grow: 1; }
        .hidden { display: none !important; }

        .bottom-bar {
            position: fixed; bottom: 0; width: 100%; height: 60px;
            background: rgba(0,0,0,0.9); display: flex; justify-content: space-between;
            align-items: center; padding: 0 40px; font-size: 11px; font-weight: bold; box-sizing: border-box;
        }
        .btn-hint { background: white; color: black; border-radius: 50%; padding: 2px 7px; margin-right: 5px; }
    </style>
</head>
<body>

    <header class="top-bar">
        <div>NOT<span style="color:var(--sky)">STEAM</span></div>
        <div id="clock">00:00</div>
    </header>

    <main id="main-view">
        <section class="shelf">
            <h2 style="font-size:12px; opacity:0.6; text-transform:uppercase;">Ma Bibliothèque (Scan Automatique)</h2>
            <div class="game-carousel" id="game-list">
                <p id="loading-text">Scan des dossiers GitHub...</p>
            </div>
        </section>
    </main>

    <div id="emulator-overlay" class="hidden">
        <div style="background:var(--steam-blue); padding:10px; display:flex; justify-content:space-between; align-items:center;">
            <span id="playing-title">Chargement...</span>
            <button onclick="location.reload()" style="background:#e11d48; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">QUITTER</button>
        </div>
        <div id="display"></div>
    </div>

    <footer class="bottom-bar">
        <div><span style="background:rgba(255,255,255,0.1); padding:5px 12px; border-radius:20px;">STEAM</span></div>
        <div>
            <span><b class="btn-hint">A</b> LANCER</span>
            <span style="margin-left:20px;"><b class="btn-hint">B</b> RETOUR</span>
        </div>
    </footer>

    <script>
        // --- CONFIGURATION AUTO-SCAN ---
        const USER = "kevinraphael95";
        const REPO = "notsteam";
        const FOLDER = "nes"; // Le dossier à scanner
        const API_URL = `https://api.github.com/repos/${USER}/${REPO}/contents/${FOLDER}`;
        const RAW_URL = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${FOLDER}/`;

        let games = [];
        let currentIndex = 0;
        let lastMove = 0; // Pour éviter que la manette aille trop vite

        // 1. SCAN AUTOMATIQUE DES ROMS
        async function scanRoms() {
            try {
                const response = await fetch(API_URL);
                const files = await response.json();
                
                // On filtre pour ne garder que les fichiers .nes
                games = files
                    .filter(file => file.name.endsWith('.nes'))
                    .map(file => ({
                        title: file.name.replace('.nes', ''),
                        file: file.name
                    }));

                renderLibrary();
            } catch (error) {
                document.getElementById('loading-text').innerText = "Erreur de scan. Vérifie ton dépôt public.";
            }
        }

        function renderLibrary() {
            const list = document.getElementById('game-list');
            list.innerHTML = '';
            games.forEach((game, i) => {
                const card = document.createElement('div');
                card.className = "game-card";
                card.tabIndex = 0;
                card.innerHTML = `<div style="font-weight:bold;">${game.title}</div>`;
                card.onclick = () => launch(game);
                list.appendChild(card);
            });
            updateFocus();
        }

        function updateFocus() {
            const cards = document.querySelectorAll('.game-card');
            cards.forEach((c, i) => c.classList.toggle('active', i === currentIndex));
            if(cards[currentIndex]) {
                cards[currentIndex].focus();
                cards[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        // 2. LOGIQUE MANETTE AMÉLIORÉE (Anti-Répétition)
        function checkGamepad() {
            const gp = navigator.getGamepads()[0];
            if (!gp) return;

            const now = Date.now();
            if (now - lastMove < 200) return; // Limite à 5 mouvements par seconde

            // Joystick gauche ou D-Pad
            const xAxis = gp.axes[0];
            const dPadLeft = gp.buttons[14].pressed;
            const dPadRight = gp.buttons[15].pressed;

            if (xAxis > 0.5 || dPadRight) {
                if (currentIndex < games.length - 1) { 
                    currentIndex++; 
                    updateFocus(); 
                    lastMove = now;
                }
            } else if (xAxis < -0.5 || dPadLeft) {
                if (currentIndex > 0) { 
                    currentIndex--; 
                    updateFocus(); 
                    lastMove = now;
                }
            }

            // Bouton A (Lancer)
            if (gp.buttons[0].pressed && document.getElementById('emulator-overlay').classList.contains('hidden')) {
                launch(games[currentIndex]);
                lastMove = now;
            }
        }
        setInterval(checkGamepad, 16); // 60 FPS pour la réactivité

        // 3. LANCEMENT
        function launch(game) {
            document.getElementById('emulator-overlay').classList.remove('hidden');
            document.getElementById('playing-title').innerText = "Lecture : " + game.title;

            window.EJS_player = '#display';
            window.EJS_core = 'nes';
            window.EJS_gameUrl = RAW_URL + encodeURIComponent(game.file);
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

            const s = document.createElement('script');
            s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.head.appendChild(s);
        }

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
        }, 1000);

        scanRoms();
    </script>
</body>
</html>
